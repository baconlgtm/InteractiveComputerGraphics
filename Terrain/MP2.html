<!DOCTYPE HTML> 
<html lang="en"> 
<head>
<title>Terrain Generation</title>
<meta charset="utf-8"> 
</head>

    
<script id="shader-vs" type="x-shader/x-vertex">
    attribute vec3 aVertexNormal;
    attribute vec3 aVertexPosition;
   
    uniform mat4 uMVMatrix;
    uniform mat4 uPMatrix;
    uniform mat3 uNMatrix;
    varying vec3 vNormal;
    varying vec3 vPosition;
    varying vec3 color;
    uniform float ulowHeight;
    uniform float uhighHeight;

void main(void) {
    vec4 vertexPositionEye4 = uMVMatrix * vec4(aVertexPosition, 1.0);
    vPosition = vertexPositionEye4.xyz / vertexPositionEye4.w;
    vNormal = normalize(uNMatrix * aVertexNormal);
    
    gl_Position = uPMatrix * uMVMatrix * vec4(aVertexPosition, 1.0);
    
    float heightDiff = uhighHeight-ulowHeight;
    float num = (aVertexPosition.z - ulowHeight) / heightDiff;
    
    if (num < 0.25) {
        color = vec3(0,0,1); 
    } else if (num < 0.50) {
        color = vec3(0,0.53,0.07); 
    } else if (num < 0.75) {
        color = vec3(0.4, 0.2, 0); 
    } else {
        color = vec3(1,1,1); 
    }
}
</script>

<script id="shader-fs" type="x-shader/x-fragment">
precision mediump float;
//new
uniform vec3 uLightPosition;
uniform vec3 uAmbientLightColor;
uniform vec3 uDiffuseLightColor;
uniform vec3 uSpecularLightColor;

uniform vec3 uKAmbient;
uniform vec3 uKDiffuse;
uniform vec3 uKSpecular;
uniform float uShininess;

varying vec3 vNormal;
varying vec3 vPosition;
varying vec3 color;

//new
uniform bool Fog;

void main(void) {
    float fogCoord = (gl_FragCoord.z/gl_FragCoord.w);
    vec4 fogColor = vec4(1.0, 1.0, 1.0, 1.0);
    const float LOG2 = 1.442695;
    float fogDensity = 0.4;
    float fogFactor = exp2(-fogDensity * fogDensity * fogCoord * fogCoord * LOG2 );
    if (Fog){
        fogFactor = clamp(fogFactor, 0.0, 1.0);
    }
    else{
        fogFactor = 1.0;
    }
    
    //new
  
    // Calculate the vector (l) to the light source
    vec3 vectorToLightSource = normalize(uLightPosition - vPosition);
    
    // Transform the normal (n) to view coordinates
    vec3 normalEye = normalize(vNormal);
    
    // Calculate n dot l for diffuse lighting
    float diffuseLightWeightning = max(dot(normalEye, 
                                    vectorToLightSource), 0.0);
                                       
    // Calculate the reflection vector (r) that is needed for specular light
    vec3 reflectionVector = normalize(reflect(-vectorToLightSource, 
                                             normalEye));
    
    // The camera in eye coordinates is located in the origin and is pointing
    // along the negative z-axis. Calculate viewVector (v) 
    // in eye coordinates as:
    // (0.0, 0.0, 0.0) - vertexPositionEye3
    vec3 viewVectorEye = -normalize(vPosition);
    
    float rdotv = max(dot(reflectionVector, normalEye), 0.0);
    
    float specularLightWeightning = pow(rdotv, uShininess);

    // Sum up all three reflection components and send to the fragment shader
    vec4 uniColor = vec4(((uAmbientLightColor*uKAmbient)
                + (uDiffuseLightColor*color) * diffuseLightWeightning
                + ((uSpecularLightColor*uKSpecular) * specularLightWeightning)),1.0);
    //new
    gl_FragColor = mix(fogColor, uniColor, fogFactor );
 }
</script>

<script src="gl-matrix-min.js"></script> 
<script src="Terrain.js"></script>  
<script src="MP2.js"></script>   
<body onload="startup();">
 <canvas id="myGLCanvas" width="800" height="800"></canvas>
    <form id="input_form">
        <fieldset>
            <legend>Rendering Parameters</legend>
         <input type="radio" name="primitive" id="wireframe" value="wireframe"> Wireframe
         <input type="radio" name="primitive" id="polygon" id="polygon" value="polygon" checked> Polygon
         <input type="radio" name="primitive" id="wirepoly" value="wirepoly" > Polygon with Edges  
        </fieldset>
        
        <fieldset>
            <legend>Fog Effect</legend>
            <input type="radio" name="fog" id="fog" checked> On
            <input type="radio" name="fog"> off
        </fieldset>
        
        <fieldset>
            <legend>Controls</legend>
            <emph>Roll Degree</emph> <input type="number" id="roll"> Roll Control: Left or Right <br>
            <emph>Pitch Degree</emph> <input type="number" id="pitch"> Pitch Control: Up or Down <br>
            <emph>Speed</emph> <input type="number" id="speed"> Speed Control: + and -
        </fieldset>
        
        <fieldset>
            <legend>Additional</legend>
            You can press R to reset camera position
        </fieldset>
    </form>
</body>

</html>
